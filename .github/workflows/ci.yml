# The verification gate from CLAUDE.md, run on every proposed change.
#
# The point of this workflow is not that it runs the tests. It is that it
# cannot pass while the integration suites are silently absent. Those suites
# are where the visibility rules are proved -- a private item is 404 not 403,
# a public page leaks no private reference, file bytes re-check visibility --
# and without a database they skip rather than fail. REQUIRE_TEST_DB in the
# `node` job is what closes that hole; the pandoc probe in `python` closes the
# smaller one beside it.
name: CI

# pull_request covers every proposed change. push is narrowed to main so a
# branch with an open pull request is not built twice for the same commit.
on:
  pull_request:
  push:
    branches: [main]
    # A version tag publishes a version-tagged image. Nothing in the
    # repository creates one yet; the trigger exists so that when it does, the
    # same validated pipeline is what produces the artifact.
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pushes to a pull request are cancelled; main is never
  # cancelled, so the record of what passed on the default branch stays whole.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: node
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # 8.4 is what docker-compose.yml pins for production. Not substitutable:
      # the migrations declare utf8mb4_0900_ai_ci and migrations.test.ts
      # asserts TABLE_COLLATION, so MariaDB or MySQL 5.7 would fail outright.
      #
      # Service containers accept no `command:`, so the compose file's
      # --character-set-server / --collation-server flags cannot be passed
      # here. That is fine only because every CREATE TABLE states its
      # collation explicitly and 8.4 already defaults to utf8mb4_0900_ai_ci.
      # A future table without an explicit collation would diverge from
      # production silently.
      #
      # The digest is the same one docker-compose.yml pins, and it is the
      # point: this job's whole claim is that the migrations and the
      # visibility suites passed against the database production runs, which
      # a tag resolved twice cannot promise. Change both together.
      mysql:
        image: mysql:8.4@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
        env:
          # Throwaway values for an ephemeral container that exists for the
          # length of one job. Nothing secret belongs in a workflow file.
          MYSQL_ROOT_PASSWORD: ci-root-not-a-secret
          # Must equal TEST_DB_NAME below: createHarness() runs migrateDown(0)
          # then migrateUp(), and never issues CREATE DATABASE.
          MYSQL_DATABASE: dissertation_test
          MYSQL_USER: dissertation
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        # --host=127.0.0.1 is deliberate. The image's init phase runs a
        # temporary server with --skip-networking, so a socket-based ping goes
        # green before MYSQL_DATABASE and MYSQL_USER exist. TCP cannot.
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ci-root-not-a-secret --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=10s

    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '3306'
      TEST_DB_NAME: dissertation_test
      TEST_DB_USER: dissertation
      TEST_DB_PASSWORD: testpass
      # Without this the job passes green having run zero visibility tests.
      REQUIRE_TEST_DB: '1'
      # Same argument for storage: without it a run that never reached an S3
      # endpoint skips the backend suites and still reports success.
      REQUIRE_TEST_S3: '1'
      TEST_S3_ENDPOINT: http://127.0.0.1:5000

    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes; the default writes the token into .git/config.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # engines.node is >=22 and the Dockerfile builds on node:22.
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A real S3 endpoint over HTTP rather than a fake of our own: the S3
      # suites assert key encoding, content length, streaming and how the SDK
      # reports a missing object, none of which a stub would prove.
      #
      # moto rather than MinIO, whose open-source server is archived upstream
      # and no longer receives security updates -- pinning that image would put
      # an unmaintained dependency into CI, which is the thing every other pin
      # here exists to prevent. It is a pip install rather than a service
      # container, so there is no image digest to keep in step either.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Start an S3 endpoint
        run: |
          python -m pip install --quiet 'moto[server]'
          python -m moto.server -p 5000 &
          for _ in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:5000/; then
              echo "s3 endpoint is up"; exit 0
            fi
            sleep 1
          done
          echo "the S3 endpoint never came up" >&2
          exit 1

      # Cheapest and most commonly forgotten, so it goes first.
      - name: Format
        run: npm run format:check

      # The rules CLAUDE.md states in prose: what may bypass autoescaping, the
      # CSP's ban on inline styles and un-nonced scripts, and the visibility
      # chokepoint. Needs no database and no build, so it fails fast.
      - name: Invariants
        run: node .github/scripts/check-invariants.mjs

      # Before lint on purpose: both read tsconfig.typecheck.json, but on a
      # broken program tsc gives one located message where the typed ESLint
      # rules give a cascade. Running tsc first makes the clearer one win.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Not redundant with typecheck, which is a strict superset of this
      # tsconfig's type checking. `npm run build` also runs copy-assets.mjs and
      # vendor-assets.mjs, which no other gate exercises at all.
      - name: Build
        run: npm run build

      # The service is already healthy before step one runs, so this is a
      # second line of defence rather than a wait. It connects through the same
      # driver, with the same TEST_DB_* values, to the same database that
      # vitest will -- so a green check here cannot mean something different
      # from a green connect inside the suites, and a credential mismatch
      # fails here with an obvious step name instead of seven times over.
      - name: Confirm the test database accepts the test credentials
        run: node .github/scripts/check-test-db.mjs

      # Never shard this run and never touch poolOptions. vitest.config.ts sets
      # singleFork because all seven integration suites share one schema and
      # each drops it; any parallelism is cross-file schema corruption.
      - name: Test
        run: npm test

      # Production dependencies only: a dev-only advisory with no fix available
      # would otherwise block every pull request for something that never
      # reaches a server. high and above for the same reason -- a genuine
      # high-severity vulnerability in shipped code SHOULD block a merge, and
      # the answer when it does is to deal with the advisory, not to lower this
      # number. Run plain `npm audit` periodically for the fuller picture.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  # Only on pull_request: a push to main has no base branch to diff against.
  # Its own job rather than a step in `node`, because it is the one thing here
  # that needs full history, and fetch-depth: 0 would slow that checkout for
  # every other step that does not.
  # A backup nobody has restored is a hypothesis. This runs the whole drill --
  # the real backup handler, a real restore into a scratch database, then the
  # export -- and fails if what comes back out does not match what went in.
  #
  # It exists because the risk to a five-year dissertation is not a bug in this
  # application; it is that in 2031 nobody can build the image, and the research
  # is trapped in a dump nobody has ever opened.
  rehearsal:
    name: restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Same image and reasoning as the `node` job: the schema declares
      # utf8mb4_0900_ai_ci, which MariaDB and MySQL 5.7 do not have. Same
      # digest too -- a rehearsal that restores into a different build of
      # MySQL than production runs is rehearsing the wrong thing.
      mysql:
        image: mysql:8.4@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
        env:
          MYSQL_ROOT_PASSWORD: ci-root-not-a-secret
          MYSQL_DATABASE: rehearsal_source
          MYSQL_USER: dissertation
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ci-root-not-a-secret --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=10s

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: rehearsal_source
      DB_USER: dissertation
      DB_PASSWORD: testpass
      REHEARSAL_DB_NAME: rehearsal_restored
      # The drill CREATEs and DROPs the scratch database. The service container
      # grants `dissertation` rights on MYSQL_DATABASE and nothing else, which
      # is how a well-configured deployment looks too -- so the scratch database
      # gets its own credentials rather than widening the application user's.
      REHEARSAL_DB_USER: root
      REHEARSAL_DB_PASSWORD: ci-root-not-a-secret
      BACKUP_ROOT: /tmp/rehearsal-backups
      STORAGE_ROOT: /tmp/rehearsal-files
      # The export loads the application's own config, which validates every
      # setting. These are the values a local development run uses.
      NODE_ENV: test
      PUBLIC_BASE_URL: http://localhost:8080
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGIN: http://localhost:8080
      SESSION_SECURE_COOKIES: 'false'
      PYTHON: python3
      NODE: node

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          npm ci
          python3 -m pip install --quiet -e .

      # The rehearsal shells out to both. Installed explicitly rather than
      # relying on whatever the runner image happens to carry, because a
      # missing client would make this job fail for a reason unrelated to the
      # thing it is testing.
      - name: Install the MySQL client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: |
          mkdir -p "$BACKUP_ROOT" "$STORAGE_ROOT"
          npm run migrate -- up

      # Diacritics on purpose. A dump and restore that mangles them is the
      # failure this catches, and Romanian names are most of the corpus.
      - name: Seed a small corpus
        run: |
          mysql --host=127.0.0.1 --user="$DB_USER" --password="$DB_PASSWORD" \
            --default-character-set=utf8mb4 "$DB_NAME" <<'SQL'
          INSERT INTO content_item (kind, slug, title, visibility)
            VALUES ('essay','opening-chapter','The Opening Chapter','public');
          INSERT INTO essay_detail (content_item_id, body_markdown, status, word_count)
            VALUES (LAST_INSERT_ID(), 'The commission met in Iași.[[cite:hooligan-year|45-47]]', 'draft', 6);
          INSERT INTO content_item (kind, slug, title, visibility)
            VALUES ('source','hooligan-year','Anii Ș','public');
          INSERT INTO source_detail (content_item_id, csl_type, csl_json, issued_year, archive, call_number)
            VALUES (LAST_INSERT_ID(), 'book',
                    CAST('{"id":"hooligan-year","type":"book","title":"Anii Ș"}' AS JSON),
                    1996, 'Arhivele Naționale ale României', 'Fond 2242, dosar 17/1941');
          INSERT INTO content_item (kind, slug, title, visibility)
            VALUES ('person','ion-antonescu','Ion Antonescu','public');
          INSERT INTO agent_detail (content_item_id, family_name, given_name)
            VALUES (LAST_INSERT_ID(), 'Antonescu', 'Ion');
          SQL

      - name: Rehearse the restore
        run: scripts/restore-rehearsal.sh --keep-output
        env:
          REHEARSAL_OUTPUT_DIR: /tmp/rehearsal-export

      # The drill compares row counts; this asserts the bytes survived, which
      # a count cannot see. Romanian names are most of this corpus, and a
      # character set mismatch anywhere along dump -> restore -> export
      # mangles them silently.
      - name: Diacritics survived the round trip
        run: |
          grep -q 'Arhivele Naționale ale României' /tmp/rehearsal-export/sources/provenance.json
          grep -q 'Iași' /tmp/rehearsal-export/essays/opening-chapter.md
          echo "UTF-8 survived mysqldump, restore and export."

  migrations:
    name: migrations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The guard diffs against the merge base, so the base branch and the
          # history back to it must actually be present.
          fetch-depth: 0

      - name: No applied migration was edited
        run: .github/scripts/check-migrations.sh "origin/${{ github.base_ref }}"

  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          # Pinned rather than a matrix: the runtime image is Debian bookworm,
          # whose python3 is 3.11. CI should run what ships.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      # The same pinned .deb the Dockerfile installs, so the end-to-end
      # citation test here exercises the exact binary production runs.
      - name: Install pandoc
        run: .github/scripts/install-pandoc.sh

      # test_manuscript_compile.py skips its end-to-end class when
      # shutil.which("pandoc") comes back empty. This step and pytest read the
      # same PATH in the same job, so a green check here means the class really
      # ran -- which is why this needs no environment variable of its own, in
      # contrast to the database above.
      - name: Confirm pandoc is on PATH
        run: pandoc --version | head -n 1

      # No venv: the runner is already disposable, so one buys nothing.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check worker/

      # -rs prints every skip with its reason, so the log says out loud whether
      # the pandoc end-to-end case ran.
      - name: Test
        run: pytest -q -rs

      # Audits what the image actually ships, derived from pyproject.toml the
      # same way the Dockerfile derives it -- not whatever happens to be in this
      # runner, which also holds pytest, ruff and pip-audit itself.
      #
      # Auditing the environment instead would need --skip-editable for the
      # local package, and --strict counts a skip as a collection failure, so
      # the two cannot be combined. Auditing the requirements sidesteps that and
      # checks the more meaningful set.
      - name: Audit dependencies
        run: |
          python3 -c "import tomllib; print('\n'.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))" > /tmp/shipped.txt
          pip-audit --strict --requirement /tmp/shipped.txt

  # The one job that runs docker-compose.yml, which is the file an operator
  # actually deploys. `node` tests the application against a service container,
  # `docker` tests the image in isolation, `rehearsal` tests the backup drill --
  # and none of them would notice a broken entrypoint order, a health check that
  # cannot authenticate, a capability set trimmed too far, or a credential
  # reaching the container that has no code to read it. Every one of those has
  # been wrong here at least once, and each was caught by hand.
  compose:
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      # Built here and loaded under the tag the compose file names, so the
      # stack starts with --no-build and this job does not repeat the `docker`
      # job's work. cache-from only: `docker` owns that scope, and two jobs
      # writing it would race for no gain.
      - name: Build the application image
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        with:
          context: .
          platforms: linux/amd64
          # Must match the `image:` in docker-compose.yml, which is now the
          # GHCR path: the stack is brought up with --no-build, so a tag that
          # does not match sends compose to the registry for an image this job
          # just built locally.
          tags: ghcr.io/thegspiro/romania:latest
          load: true
          provenance: false
          cache-from: type=gha,scope=linux/amd64

      - name: Bring the stack up and check it
        run: .github/scripts/compose-smoke.sh

      # Separate stack, separate question: the base composition mounts the data
      # directory as a Docker volume, which arrives already owned by mysql, so
      # the entrypoint's chown is a no-op and CAP_CHOWN going missing would not
      # show up above. The Unraid override bind-mounts it, which is the
      # deployment this repository ships.
      - name: Tear the first stack down
        run: docker compose down -v

      - name: Prepare the Unraid paths
        run: |
          sudo mkdir -p /mnt/user/appdata/dissertation/mysql \
                        /mnt/user/appdata/dissertation/files \
                        /mnt/user/backups/dissertation
          sudo chown 0:0 /mnt/user/appdata/dissertation/mysql

      # Not under sudo: the script only needs to read the directory, write
      # .env in the workspace and talk to the daemon. Running it as root would
      # leave a root-owned .env that the teardown step cannot remove.
      - name: Start the database on a bind mount
        run: .github/scripts/compose-unraid-check.sh

      - name: Show the logs when something failed
        if: failure()
        run: docker compose logs --tail 60 || true

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.unraid.yml down -v || true
          docker compose down -v || true
          rm -f .env

  docker:
    name: docker (${{ matrix.platform }})
    runs-on: ubuntu-latest
    # arm64 builds under emulation, which is several times slower than the
    # native one. 30 minutes was comfortable for amd64 alone and is not here.
    timeout-minutes: 60

    strategy:
      # One architecture failing should not hide the other's result.
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The Dockerfile has always carried an aarch64 branch with its own pinned
      # pandoc and tectonic digests, and nothing ever executed it. binfmt lets
      # this job both build that branch and run the smoke test against it, so
      # "arm64 is supported" is a claim CI checks rather than one the Dockerfile
      # merely asserts.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      # Third-party actions are pinned to a commit, not a tag: a tag is a
      # mutable reference, and this repository's whole point is that
      # unpublished material stays unreadable.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build the image
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: dissertation-platform:ci
          # One platform per job, so the build still produces a single image
          # that `load` can put into the daemon -- a manifest list could not be
          # loaded, and an image that is not loaded cannot be smoke-tested.
          load: true
          # `load` cannot consume the manifest list an attestation build
          # produces.
          provenance: false
          # Scoped per platform: the two builds share no layers, and a single
          # scope would have them evicting each other's cache on every run.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # Runs the arm64 binaries through binfmt. Slower than the native case,
      # and the only thing that proves the aarch64 pandoc and tectonic
      # downloads are the right architecture rather than merely the right size.
      - name: Smoke test the image
        run: .github/scripts/smoke-test-image.sh dissertation-platform:ci

  # --------------------------------------------------------------------------
  # Publishing the image.
  #
  # Until this job existed, CI built the image on every pull request and threw
  # it away, so the only way to install was to clone and build -- which on
  # Unraid ruled out both Community Applications and the Docker tab, since each
  # installs by pulling.
  #
  # It deliberately does NOT run on a pull request. A fork's token cannot write
  # packages in any case, but the rule worth stating is the other one: an image
  # built from code nobody has reviewed must not be the one an operator pulls.
  # `needs` names every other job for the same reason -- a published image is
  # an artifact somebody deploys, so it should not exist unless the tests,
  # the invariants and both architectures passed.
  publish:
    name: publish the image
    if: github.event_name == 'push'
    # Every job that can run on a push, and deliberately NOT `migrations`.
    #
    # That job is `if: github.event_name == 'pull_request'` -- its guard diffs
    # against the merge base, which does not exist on main -- so on a push it is
    # SKIPPED, and Actions skips any job whose `needs` names a skipped one.
    # Listing it here meant `publish` could never run on the only event it is
    # gated to: the first merge after this job was added went green with
    # nothing published, because a skipped job reports neither red nor absent.
    #
    # A commit reaching main has already passed the migration guard as a pull
    # request, so nothing is lost by leaving it out. Do not add it back.
    needs: [node, python, rehearsal, compose, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      # Only this job gets it. The workflow-level default stays contents:read,
      # so a change elsewhere cannot quietly acquire the ability to publish.
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve the image name and tags
        id: meta
        run: |
          set -eu
          # GHCR rejects an uppercase path and this repository is "Romania",
          # so the owner/name pair is lowercased rather than hard-coded --
          # a fork publishes to its own namespace without editing this file.
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          # Always an immutable tag naming the exact commit, so a deployment
          # can pin to something that will never move under it. `latest` moves,
          # which is why it is not the only thing published.
          tags="${image}:sha-$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
          case "${GITHUB_REF}" in
            refs/heads/main) tags="${tags},${image}:latest" ;;
            refs/tags/v*)    tags="${tags},${image}:${GITHUB_REF_NAME#v},${image}:latest" ;;
          esac

          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"
          printf 'publishing %s\n' "$tags"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      # Plain `docker login` rather than docker/login-action: it is two lines,
      # and every third-party action here has to be pinned to a commit and
      # then kept current. The token is the job's own GITHUB_TOKEN, scoped by
      # the `permissions` block above and gone when the job ends.
      - name: Log in to GHCR
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      # Both architectures in one invocation, which is what produces a single
      # multi-architecture manifest rather than two unrelated images. It reads
      # the cache the `docker` job just wrote for each platform, so this is
      # close to a no-op rather than a second full build.
      - name: Build and push
        uses: docker/build-push-action@67a2d409c0a876cbe6b11854e3e25193efe4e62d # v6.12.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          # An attestation build produces a manifest list with extra entries
          # that older clients and some mirrors handle badly. The images this
          # publishes are meant to be pulled by `docker compose` on a NAS, so
          # the plain manifest is the compatible choice.
          provenance: false
          cache-from: |
            type=gha,scope=linux/amd64
            type=gha,scope=linux/arm64

      # Prints the manifest that was actually published, so the log answers
      # "did both architectures land under that tag?" without a registry visit.
      - name: Show what was published
        run: docker buildx imagetools inspect "${{ steps.meta.outputs.image }}:sha-$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
