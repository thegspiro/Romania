# Production-shaped composition: web, worker, database.
#
# On Unraid, replace the named volumes with paths under /mnt/user/appdata and
# your array shares (see README.md). On a cloud host, set DB_HOST in .env to
# the managed database and remove the `db` service -- along with the two
# `depends_on: db` blocks that reference it, or Compose refuses to start on an
# undefined service.

name: dissertation

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dissertation-platform:latest
    restart: unless-stopped
    command: ['web']
    env_file: [.env]
    environment:
      # Defaults to the bundled service, which is reachable by name inside the
      # compose network. Interpolated rather than hard-coded so that pointing
      # DB_HOST at RDS in .env is enough: a literal here would silently
      # override .env and send every connection back to a container that a
      # cloud deployment has deleted.
      DB_HOST: ${DB_HOST:-db}
      # `env_file` loads the whole of .env, which is what keeps adding a
      # setting from meaning editing this file too. The cost is that it also
      # hands this container credentials it has no code to read, and an
      # environment variable is readable from /proc and from `docker inspect`
      # whether or not anything reads it.
      #
      # Emptied rather than left out: an `environment` entry with no value
      # resolves from .env again, which looks like an unset and is not.
      #
      # DB_ROOT_PASSWORD is the bundled database's, and the application never
      # connects as root -- holding it here would turn a compromise of this
      # container into root on the database rather than the app account.
      DB_ROOT_PASSWORD: ''
      # The Zotero key belongs to the worker alone; CLAUDE.md says the web
      # service never holds it, and until now that was true of the code and
      # false of the container. Nothing here reads it: the sync button is
      # decided by ZOTERO_LIBRARY_ID, and the job that needs the key runs in
      # the worker.
      ZOTERO_API_KEY: ''
      ZOTERO_API_KEY_FILE: ''
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: '8080'
      STORAGE_ROOT: /data/files
      BACKUP_ROOT: /data/backups
    ports:
      # Bound to loopback: this is meant to sit behind a reverse proxy that
      # terminates TLS. Publishing it on 0.0.0.0 would expose the app directly
      # over plain HTTP, where the session cookie is readable in transit.
      - '127.0.0.1:8080:8080'
    volumes:
      - files:/data/files
      - backups:/data/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', '/app/scripts/healthcheck.sh']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    # The image already runs as uid 1000, so the process holds no capabilities
    # it can use. Dropping the bounding set closes the remaining path: a setuid
    # binary reachable through a future dependency cannot regain them.
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  worker:
    # The same build as `web`, declared again rather than relying on `web` to
    # produce the tag. Without it Compose treats dissertation-platform:latest
    # as an image to pull and fails on a host that has never built it. The two
    # builds share a context and a Dockerfile, so BuildKit does the work once.
    build:
      context: .
      dockerfile: Dockerfile
    image: dissertation-platform:latest
    restart: unless-stopped
    command: ['worker']
    env_file: [.env]
    environment:
      DB_HOST: ${DB_HOST:-db}
      # Same reasoning as `web`. The Zotero key is deliberately NOT emptied
      # here: this is the process that calls the API.
      DB_ROOT_PASSWORD: ''
      STORAGE_ROOT: /data/files
      BACKUP_ROOT: /data/backups
      # Migrations belong to the web role; see scripts/entrypoint.sh.
      RUN_MIGRATIONS: 'false'
    volumes:
      - files:/data/files
      - backups:/data/backups
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    # Same reasoning as `web`: already uid 1000, so this only removes what it
    # could never legitimately use.
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  db:
    # Pinned by digest for the reason the Dockerfile records: a floating
    # tag lets the database CI tested against and the one a deployment
    # pulls drift apart without anything appearing in a diff.
    image: mysql:8.4@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # Binary logging is only needed for replication and point-in-time
      # recovery; neither applies here, and it doubles the write volume.
      - --skip-log-bin
    environment:
      MYSQL_DATABASE: ${DB_NAME:-dissertation}
      MYSQL_USER: ${DB_USER:-dissertation}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      # The application never uses root; it exists only for maintenance.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      # `mysqladmin ping` succeeds before the server finishes initialising on
      # a first run, so the query below is used instead.
      #
      # The password goes through MYSQL_PWD rather than -p. An argv element is
      # readable by every process in the container via /proc, and a health
      # check re-runs it every ten seconds for the life of the deployment, so
      # that exposure is continuous rather than momentary. `$$` escapes
      # Compose's interpolation, leaving the shell to expand the variable the
      # container already has -- which also keeps the password out of
      # `docker compose config` output.
      test:
        ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -u root -e "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    # No cap_drop here, unlike `web` and `worker`. Both of those are already
    # uid 1000 from the first instruction, so dropping the bounding set takes
    # away nothing they use. This image starts as root and drops to the mysql
    # user itself, which needs CHOWN, SETUID, SETGID and DAC_OVERRIDE among
    # others; naming that set from memory and getting it wrong is a database
    # that will not start, and nothing in CI runs this composition to catch it.
    # Worth doing with a real deployment to test against, not before.
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

volumes:
  database:
  files:
  backups:
